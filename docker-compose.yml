version: '3.8'

services:
  web:
    image: cicd-app:latest
    container_name: production_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  app_data:
    driver: local